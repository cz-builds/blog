baseURL: https://cz-builds.github.io/blog/
languageCode: en
title: "CZ Builds"
theme: stack

pagination:
  pagerSize: 10

params:
  mainSections:
    - post
  sidebar:
    emoji: ""
    subtitle: "IC student exploring AI + Hardware. Building in public."
    avatar: https://github.com/cz-builds.png

  article:
    toc: true
    readingTime: true

  widgets:
    homepage:
      - type: search
      - type: archives
      - type: categories
      - type: tag-cloud

  colorScheme:
    toggle: true
    default: auto

  footer:
    since: 2026

menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 1
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 2
    - identifier: about
      name: About
      url: /about/
      weight: 3

  social:
    - identifier: github
      name: GitHub
      url: https://github.com/cz-builds
      params:
        icon: brand-github
    - identifier: twitter
      name: Twitter
      url: https://twitter.com/cz_build
      params:
        icon: brand-twitter

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
